name: Research CI and Reproducibility Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 离线 CI 意图标识；实际隔离来自下方仅运行 fixture/mock 驱动的命令。
    env:
      DISABLE_LIVE_API: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，确保 git diff 可以正确比对

      - name: Git Diff Check (PR Only)
        if: github.event_name == 'pull_request'
        # 严格检查 PR 引入的改动是否存在多余空格或冲突标记
        run: git diff --check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          # 仅安装核心依赖，不包含大模型及可选 GPU 依赖
          pip install -r requirements.txt

      - name: W4 Approved Benchmark
        run: python -m app.validate_w4_benchmark

      - name: W6 Bootstrap Contracts and Fixtures
        run: python -m app.validate_w6_bootstrap

      - name: Pilot RCP-v0.3 Prepared-State Contract
        run: python -m app.validate_pilot_reference_curation

      - name: W6 Basic Artifact Gate
        run: python -m app.w6_quality_gate --mode basic --output outputs/quality/w6_ci_report.json

      - name: Offline Unit Tests
        run: python -m unittest discover -s tests/automated -p "test_*.py" -q

      - name: Basic Quality Gate
        # 完整 unittest 已由上一独立 blocking step 执行；此处只运行其余门禁检查。
        run: python -m app.quality_gate --level basic --skip-tests

      - name: W5 Artifact Reproducibility Check
        run: python scripts/check_w5_method_artifacts.py
